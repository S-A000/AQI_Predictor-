name: Daily AQI Training Pipeline

on:
  workflow_dispatch:

  schedule:
    # Every day at 01:30 UTC = 06:30 AM Pakistan time
    - cron: "30 1 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-aqi-training-pipeline
  cancel-in-progress: false

jobs:
  daily-training:
    name: Train 24h, 48h and 72h Models
    runs-on: ubuntu-latest

    # Local run took around 24 minutes.
    # GitHub runner may take longer.
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      BIGQUERY_DATASET_ID: ${{ secrets.BIGQUERY_DATASET_ID }}
      BIGQUERY_FEATURE_TABLE: ${{ secrets.BIGQUERY_FEATURE_TABLE }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}

      MLFLOW_TRACKING_URI: sqlite:///mlflow.db

      ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
      ALERT_SMTP_PORT: ${{ secrets.ALERT_SMTP_PORT }}
      ALERT_SMTP_USE_TLS: ${{ secrets.ALERT_SMTP_USE_TLS }}
      ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      ALERT_TO_EMAILS: ${{ secrets.ALERT_TO_EMAILS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration
        shell: bash
        run: |
          python - <<'PY'
          import os

          required_variables = [
              "GCP_PROJECT_ID",
              "BIGQUERY_DATASET_ID",
              "BIGQUERY_FEATURE_TABLE",
              "BIGQUERY_LOCATION",
          ]

          missing_variables = [
              name
              for name in required_variables
              if not os.getenv(name)
          ]

          if missing_variables:
              raise RuntimeError(
                  f"Missing required secrets: {missing_variables}"
              )

          print("Training configuration is available.")
          PY

      - name: Verify Python packages
        run: |
          python -c "from google.cloud import bigquery; print('BigQuery import working')"
          python -c "import src.feature_engineering.build_features; print('Feature engineering import working')"
          python -c "import src.training.run_pipeline; print('Training pipeline import working')"

      - name: Run daily training pipeline
        run: |
          python -m src.training.run_pipeline

      - name: Upload trained models and reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aqi-trained-models-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            models/
            data/training/scaler.joblib
            data/training/feature_build_report.json
            data/training/features_train.parquet
            data/training/features_val.parquet
            data/training/features_test.parquet
            mlflow.db
            mlruns/

      - name: Write training summary
        if: success()
        shell: bash
        run: |
          {
            echo "## AQI Training Pipeline"
            echo ""
            echo "- Status: Successful"
            echo "- Models: 24h, 48h and 72h"
            echo "- Data source: BigQuery"
            echo "- Run number: ${{ github.run_number }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send failure email
        if: failure()
        continue-on-error: true
        run: |
          python - <<'PY'
          from src.alerts.email_alert_service import EmailAlertService

          EmailAlertService().send_alert(
              title="Daily AQI Training Pipeline Failed",
              message=(
                  "The daily AQI model-training workflow failed in "
                  "GitHub Actions. Open the repository Actions tab and "
                  "inspect the latest Daily AQI Training Pipeline logs."
              ),
              severity="critical",
          )
          PY